name: nightly

# Longer-running gates: fuzzing the untrusted-input boundaries and the performance budgets.
# Also run before every release (tags v*) and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parser, form, theme_import, multipart]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=2048 -timeout=10
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rbb
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rbb_load
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rbb" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://rbb@localhost:5432/rbb_load
      RBB_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      RBB_LISTEN: 127.0.0.1:8090
      RBB_ADMIN_LISTEN: 127.0.0.1:9090
      RBB_QUERY_SAMPLE_RATE: "1"
      RBB_LOG_JSON: "true"
      PSQL: psql
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          go install github.com/rakyll/hey@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked
      - name: Seed a board
        run: |
          RBB_ADMIN_PASSWORD=ci-admin-password ./target/release/rbb install --admin-email ci@example.com
          ./target/release/rbb seed --users 5000 --threads 20000 --posts 200000
          # Every request comes from 127.0.0.1, so the per-IP limit (600/min) would turn the
          # route budgets into a test of the rate limiter. Overload is still checked below.
          psql "$DATABASE_URL" -c "INSERT INTO settings (name, value) VALUES ('ratelimit_requests', '0') ON CONFLICT (name) DO UPDATE SET value = '0'"
      - name: Performance budgets (latency, statements, pool wait, memory, overload)
        run: |
          ./target/release/rbb serve > server.log 2>&1 &
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:8090/readyz && break; sleep 0.2; done
          tests/load_budget.sh http://127.0.0.1:8090 $(pgrep -f "rbb serve") http://127.0.0.1:9090/metrics
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-server-log
          path: server.log
