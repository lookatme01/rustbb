name: release

# Pushing a tag like v0.6.0 builds Linux binaries and publishes them as a GitHub Release.
# Running this workflow by hand builds the same binaries as artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # zig links against glibc 2.17, so the binary runs on any Linux distribution from 2014 on
      # (RHEL/CentOS 7, Debian 8, Ubuntu 14.04) without building on an old system.
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
      - name: Needs nothing newer than glibc 2.17
        run: |
          bin=target/${{ matrix.target }}/release/rbb
          newest=$(readelf --version-info --wide "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ -n "$newest" ] && [ "$(printf '%s\nGLIBC_2.17\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.17" ]
      - name: Runs here and on CentOS 7
        if: startsWith(matrix.target, 'x86_64')
        run: |
          target/${{ matrix.target }}/release/rbb --version
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/b" centos:7 /b/rbb --version
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name=rbb-$version-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rbb README.md CHANGELOG.md .env.example "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rbb-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum rbb-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      # The notes are this version's section of CHANGELOG.md ("## 0.6.0" up to the next "## ").
      - name: Release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="## $version" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "rbb ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
