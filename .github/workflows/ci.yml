name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rbb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rbb" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Every integration test creates, migrates and drops its own database here.
      RBB_TEST_DATABASE_URL: postgres://rbb@localhost:5432/postgres
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Unit, integration, concurrency and property tests
        run: cargo test --locked -- --include-ignored
      - name: Migrations are append-only
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          base=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          if [ -n "$base" ]; then
            changed=$(git diff --name-status "$base" HEAD -- migrations | grep -v '^A' || true)
            if [ -n "$changed" ]; then echo "existing migrations were changed or removed:"; echo "$changed"; exit 1; fi
          fi
      - name: Migrations apply to an empty database, twice, and doctor is happy
        env:
          RBB_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: postgres://rbb@localhost:5432/rbb_migrate
        run: |
          psql postgres://rbb@localhost:5432/postgres -c "CREATE DATABASE rbb_migrate"
          cargo run --locked --quiet -- migrate
          cargo run --locked --quiet -- migrate
          RBB_ADMIN_PASSWORD=ci-admin-password cargo run --locked --quiet -- install --admin-email ci@example.com
          # Failures fail the build; warnings (mail goes to the log in CI) are expected.
          cargo run --locked --quiet -- doctor
          cargo run --locked --quiet -- check
      - name: End-to-end shell suites (including the moderation workflow)
        env:
          E2E_SERVER_URL: postgres://rbb@localhost:5432
          PSQL: psql
        run: |
          cargo build --locked
          scripts/e2e.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RustSec advisories, licenses, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: dtolnay/rust-toolchain@stable
      - name: Software bill of materials (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename rbb.sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: rbb.sbom.json
