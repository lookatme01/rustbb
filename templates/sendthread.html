{% extends "layout.html" %}
{% block content %}
<form method="post" action="/thread/{{ thread.tid }}/send" class="box mw-720">
  <input type="hidden" name="my_post_key" value="{{ csrf }}">
  <div class="box-head"><h2>Send thread to a friend</h2><span class="desc">“{{ thread.subject }}”. A link to the thread is added to your message.</span></div>
  <div class="form-row"><label for="email">Friend's email address</label><input id="email" name="email" type="email" required maxlength="200"></div>
  <div class="form-row"><label for="subject">Subject</label><input id="subject" name="subject" type="text" required maxlength="200" value="{{ subject }}"></div>
  <div class="form-row"><label for="message">Message</label><textarea id="message" name="message" rows="6">I found this thread and thought you'd be interested.</textarea></div>
  <div class="box-foot"><button class="btn" type="submit">Send thread</button></div>
</form>
{% endblock %}
