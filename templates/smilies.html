{% extends "layout.html" %}
{% block content %}
<header class="page-head">
  <div class="grow"><h1>Smilies</h1></div>
</header>
<section class="card">
<table class="grid"><thead><tr><th>Smilie</th><th>Name</th><th>Text</th></tr></thead><tbody>
{% for s in smilies %}<tr><td><img src="{{ s.image }}" alt="{{ s.name }}" width="24" height="24"></td><td>{{ s.name }}</td><td><code>{{ s.find.split("\n")|join("  ") }}</code></td></tr>{% endfor %}
</tbody></table></section>
{% endblock %}
