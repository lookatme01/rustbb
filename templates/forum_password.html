{% extends "layout.html" %}
{% import "macros.html" as m %}
{% block content %}
<div class="auth">
  <div class="card auth-card">
    <span class="auth-logo">{{ m.logo_mark(48) }}</span>
    <h1>Password required</h1>
    <p class="muted">The forum “{{ forum_name }}” is password protected.</p>
    <form method="post" action="/forum/{{ fid }}/password" class="auth-form">
      {{ m.csrf_field() }}<input type="hidden" name="return_to" value="{{ return_to }}">
      <div class="auth-field"><label for="fpw">Password</label><input id="fpw" type="password" name="password" required autofocus></div>
      <button class="btn block" type="submit">Enter forum</button>
    </form>
  </div>
</div>
{% endblock %}
