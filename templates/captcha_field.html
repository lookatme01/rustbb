<div class="captcha">
  <label for="captcha-input">Image verification</label>
  <div class="captcha-row">
    <img class="js-captcha-img" src="/captcha/{{ captcha }}" width="220" height="70" alt="Verification code image">
    <input type="hidden" name="captcha_hash" value="{{ captcha }}" class="js-captcha-hash">
    <input id="captcha-input" type="text" name="captcha" inputmode="numeric" autocomplete="off" required size="8" placeholder="Digits"{% if bb.captchapow == '1' %} data-pow-bits="{{ bb.captchapowbits }}"{% endif %}>
    <button type="button" class="btn btn-ghost btn-sm js-captcha-refresh">New image</button>
  </div>
  <span class="help small muted">Enter the digits shown in the image.</span>
</div>
{% if bb.captchapow == '1' %}<script type="module" src="{{ asset('js/captcha-pow.mjs') }}"></script>{% endif %}
