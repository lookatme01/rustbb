{% extends "layout.html" %}
{% block content %}
<article class="post one-col">
  <div class="post-main">
    <header class="post-head"><strong>Announcement</strong>{% if author %} by <a href="{{ url_user(author.uid, author.username) }}">{{ author.formatted|safe }}</a>{% endif %} · {{ a.startdate|date('datetime') }}{% if a.enddate %} · until {{ a.enddate|date('date') }}{% endif %}</header>
    <div class="post-body">{{ html|safe }}</div>
  </div>
</article>
{% endblock %}
