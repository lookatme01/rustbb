<!DOCTYPE html>
<html lang="en" data-mode="light"><head><meta charset="utf-8"><title>{{ thread.subject }} — {{ bb.bbname }}</title>
<link rel="stylesheet" href="{{ asset('css/tokens.css') }}"><link rel="stylesheet" href="{{ asset('css/rbb.css') }}"></head>
<body class="print-page"><main class="wrap">
<p class="small soft">{{ bb.bbname }} — {{ forum.name }}<br>{{ bb.bburl }}/thread/{{ thread.tid }}</p>
<h1>{{ thread.subject }}</h1>
{% for p in posts %}<article class="print-post"><strong>{{ p.username }}</strong> — {{ p.dateline|date('datetime') }}<div class="post-body">{{ p.message|safe }}</div></article>{% endfor %}
</main></body></html>
