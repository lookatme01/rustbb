{% extends "layout.html" %}
{% import "macros.html" as m %}
{% block content %}
<div class="auth">
  <div class="card auth-card">
    <span class="auth-logo">{{ m.logo_mark(48) }}</span>
    <h1>Two-factor authentication</h1>
    <p class="muted">Enter the 6-digit code from your authenticator app.</p>
    {{ m.errors_box(errors) }}
    <form method="post" action="/member/login/2fa" class="auth-form">
      {{ m.csrf_field() }}<input type="hidden" name="pending" value="{{ pending }}"><input type="hidden" name="return_to" value="{{ return_to }}">
      <div class="auth-field"><label for="code">Authentication code</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></div>
      <button class="btn block" type="submit">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
