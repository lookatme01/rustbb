{% extends "layout.html" %}
{% import "macros.html" as m %}
{% block content %}
<form method="post" action="/report" class="box" style="max-width:720px">{{ m.csrf_field() }}<input type="hidden" name="type" value="{{ kind }}"><input type="hidden" name="id" value="{{ id }}">
  <div class="box-head"><h2>Report {{ desc }}</h2></div>
  <div class="form-row"><span class="label"><strong>Reason</strong></span><div class="checks">{% for r in reasons %}<label><input type="radio" name="reason" value="{{ r.rid }}" required> {{ r.title }}</label>{% endfor %}</div></div>
  <div class="form-row"><label for="comment">Details</label><textarea id="comment" name="comment" rows="4" maxlength="500" placeholder="Tell the moderators what's wrong (required for “Other”)."></textarea></div>
  <div class="box-foot"><button class="btn" type="submit">Send report</button></div>
</form>
{% endblock %}
