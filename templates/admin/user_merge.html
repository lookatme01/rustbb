{% extends "admin/base.html" %}
{% import "macros.html" as m %}
{% block acp %}
<form method="post" action="/admin/users/merge" class="box js-confirm" data-confirm="Merge these accounts? The source account is deleted.">{{ m.csrf_field() }}
  <div class="box-head"><h2>Merge users</h2></div>
  <div class="box-body"><p class="small muted">All posts, threads, messages, reputation and attachments of the source account move to the destination account. The source account is then deleted.</p></div>
  <div class="form-row"><label for="source">Source username</label><input id="source" type="text" name="source" required></div>
  <div class="form-row"><label for="destination">Destination username</label><input id="destination" type="text" name="destination" required></div>
  <div class="box-foot"><button class="btn danger">Merge</button></div>
</form>
{% endblock %}
