{% extends "admin/base.html" %}
{% import "macros.html" as m %}
{% block acp %}
{% if error %}<div class="notice bad"><strong>The template has a syntax error and was not saved:</strong><pre style="white-space:pre-wrap;margin:6px 0 0">{{ error }}</pre></div>{% endif %}
<form method="post" action="/admin/themes/{{ th.tid }}/template" class="box">{{ m.csrf_field() }}<input type="hidden" name="name" value="{{ name }}">
  <div class="box-head"><h2><code>{{ name }}</code> — {{ th.name }}</h2><a class="right" href="/admin/themes/{{ th.tid }}/templates">All templates</a></div>
  <div class="box-body"><textarea name="template" rows="30" style="font-family:var(--font-code);font-size:.82rem;white-space:pre;tab-size:2" spellcheck="false">{{ source }}</textarea></div>
  <div class="box-foot actions" style="margin:0"><button class="btn">Save template</button></div>
</form>
{% if own %}<form method="post" action="/admin/themes/{{ th.tid }}/template/revert" class="js-confirm" data-confirm="Revert to the inherited/default template?">{{ m.csrf_field() }}<input type="hidden" name="name" value="{{ name }}"><button class="btn secondary small">Revert to default</button></form>{% endif %}
{% endblock %}
