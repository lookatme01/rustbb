{% extends "admin/base.html" %}
{% import "macros.html" as m %}
{% block acp %}
<form method="post" action="/admin/users/new" class="box">{{ m.csrf_field() }}
  <div class="box-head"><h2>Add user</h2></div>
  <div class="form-row"><label for="username">Username</label><input id="username" type="text" name="username" required></div>
  <div class="form-row"><label for="email">Email</label><input id="email" type="email" name="email" required></div>
  <div class="form-row"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" required></div>
  <div class="form-row"><label for="usergroup">Primary group</label><select id="usergroup" name="usergroup">{% for g in groups %}<option value="{{ g[0] }}"{% if g[0] == 2 %} selected{% endif %}>{{ g[1] }}</option>{% endfor %}</select></div>
  <div class="box-foot"><button class="btn">Create user</button></div>
</form>
{% endblock %}
