{% extends "layout.html" %}
{% import "macros.html" as m %}
{% block content %}
<form method="post" action="/moderation/editthread" class="box">{{ m.csrf_field() }}<input type="hidden" name="tid" value="{{ thread.tid }}">
  <div class="box-head"><h2>Edit thread</h2></div>
  <div class="form-row"><label for="subject">Subject</label><input id="subject" type="text" name="subject" value="{{ thread.subject }}" required></div>
  {% if prefixes %}<div class="form-row"><label for="prefix">Prefix</label><select id="prefix" name="prefix"><option value="0">None</option>{% for p in prefixes %}<option value="{{ p.pid }}"{% if p.pid == thread.prefix %} selected{% endif %}>{{ p.prefix }}</option>{% endfor %}</select></div>{% else %}<input type="hidden" name="prefix" value="{{ thread.prefix }}">{% endif %}
  <div class="form-row"><label for="notes">Moderator notes</label><div><textarea id="notes" name="notes" rows="4">{{ thread.notes }}</textarea><span class="help">Only visible to moderators.</span></div></div>
  <div class="box-foot"><button class="btn" type="submit">Save</button> <a href="{{ thread_url }}">Cancel</a></div>
</form>
{% endblock %}
