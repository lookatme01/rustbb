{% extends "layout.html" %}
{% import "macros.html" as m %}
{% block content %}
<div class="auth">
  <div class="card auth-card">
    <span class="auth-logo">{{ m.logo_mark(48) }}</span>
    <h1>Choose a new password</h1>
    <p class="muted">Pick something you haven't used on {{ bb.bbname }} before.</p>
    {{ m.errors_box(errors) }}
    <form method="post" action="/member/resetpw" class="auth-form">
      {{ m.csrf_field() }}<input type="hidden" name="uid" value="{{ uid }}"><input type="hidden" name="code" value="{{ code }}">
      <div class="auth-field"><label for="password">New password</label><input id="password" type="password" name="password" autocomplete="new-password" required autofocus></div>
      <div class="auth-field"><label for="password2">Confirm password</label><input id="password2" type="password" name="password2" autocomplete="new-password" required></div>
      <button class="btn block" type="submit">Save password</button>
    </form>
  </div>
</div>
{% endblock %}
