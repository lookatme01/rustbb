{# textarea named "message" with toolbar; value from form.message #}
<div class="editor js-editor">
  <div class="editor-toolbar" role="toolbar" aria-label="{{ t('Formatting') }}">
    <button type="button" data-tag="b" title="{{ t('Bold') }}" aria-label="{{ t('Bold') }}"><strong>B</strong></button>
    <button type="button" data-tag="i" title="{{ t('Italic') }}" aria-label="{{ t('Italic') }}"><em>I</em></button>
    <button type="button" data-tag="u" title="{{ t('Underline') }}" aria-label="{{ t('Underline') }}"><u>U</u></button>
    <button type="button" data-tag="s" title="{{ t('Strikethrough') }}" aria-label="{{ t('Strikethrough') }}"><s>S</s></button>
    <span class="sep"></span>
    <button type="button" data-tag="url" data-prompt="{{ t('Link URL') }}" title="{{ t('Link') }}" aria-label="{{ t('Link') }}">Link</button>
    <button type="button" data-tag="img" title="{{ t('Image') }}" aria-label="{{ t('Image') }}">Img</button>
    <button type="button" data-tag="video" data-arg="youtube" title="{{ t('Video') }}" aria-label="{{ t('Video') }}">Video</button>
    <button type="button" data-tag="quote" title="{{ t('Quote') }}" aria-label="{{ t('Quote') }}">“ ”</button>
    <button type="button" data-tag="code" title="{{ t('Code') }}" aria-label="{{ t('Code') }}">&lt;/&gt;</button>
    <button type="button" data-tag="spoiler" title="{{ t('Spoiler') }}" aria-label="{{ t('Spoiler') }}">Spoiler</button>
    <button type="button" data-tag="list" data-list="1" title="{{ t('List') }}" aria-label="{{ t('List') }}">• List</button>
    <span class="sep"></span>
    <select data-tag="size" aria-label="{{ t('Font size') }}"><option value="">Size</option><option value="small">Small</option><option value="large">Large</option><option value="x-large">X-Large</option></select>
    <select data-tag="color" aria-label="{{ t('Color') }}"><option value="">Color</option><option value="red">Red</option><option value="green">Green</option><option value="blue">Blue</option><option value="orange">Orange</option><option value="purple">Purple</option><option value="gray">Gray</option></select>
    <select data-tag="align" aria-label="{{ t('Alignment') }}"><option value="">Align</option><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
    <button type="button" class="tab js-tab-write active" aria-pressed="true">{{ t('Write') }}</button>
    <button type="button" class="js-tab-preview" aria-pressed="false">{{ t('Preview') }}</button>
  </div>
  <textarea name="message" id="message" rows="12" aria-label="{{ t('Message') }}" required>{{ form.message if form is defined and form else (draft[1] if draft else '') }}</textarea>
  <div class="live-preview post-body" aria-live="polite"></div>
  {% if smilies %}<div class="smilie-picker">{% for s in smilies %}<button type="button" class="js-smilie" data-code="{{ s.find }}" title="{{ s.name }}"><img class="smilie" src="{{ s.image }}" alt="{{ s.find }}"></button>{% endfor %}</div>{% endif %}
  <div class="editor-status"><span class="js-charcount"></span><span class="js-draft-status"></span></div>
</div>
<script type="module" src="{{ asset('js/editor.mjs') }}"></script>
