{% extends "layout.html" %}
{% block content %}
<section class="box"><div class="box-head"><h2>Friends</h2><a class="right" href="/usercp/lists">Manage lists</a></div>
<table class="grid"><tbody>{% for b in list %}<tr><td><span class="online-dot{% if b.online %} on{% endif %}"></span><a href="{{ url_user(b.uid) }}">{{ b.formatted|safe }}</a></td><td class="small muted">Last active {{ b.lastactive|date }}</td><td><a href="/pm/send?uid={{ b.uid }}">Send message</a></td></tr>{% else %}<tr><td class="empty">Your friends list is empty.</td></tr>{% endfor %}</tbody></table></section>
{% endblock %}
