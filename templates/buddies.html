{% extends "layout.html" %}
{% block content %}
<header class="page-head">
  <div class="grow"><h1>Friends</h1></div>
  <div class="actions"><a class="btn btn-ghost" href="/usercp/lists">Manage lists</a></div>
</header>
<section class="card">
<table class="grid"><tbody>{% for b in list %}<tr><td><span class="online-dot{% if b.online %} on{% endif %}"></span><a href="{{ url_user(b.uid) }}">{{ b.formatted|safe }}</a></td><td class="small muted">Last active {{ b.lastactive|date }}</td><td><a class="btn btn-ghost btn-sm" href="/pm/send?uid={{ b.uid }}">Send message</a></td></tr>{% else %}<tr><td class="empty">Your friends list is empty.</td></tr>{% endfor %}</tbody></table></section>
{% endblock %}
