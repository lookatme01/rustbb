# cargo-deny: security advisories, licenses, banned crates and allowed sources (run in CI).
[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the build; unmaintained crates are reported.
yanked = "deny"
ignore = [
    # Marvin attack: timing side channel in RSA *decryption* with a private key. No fixed release
    # exists. rbb only validates and encrypts to members' public keys; private keys never reach
    # the server (end-to-end PM encryption happens in the browser).
    { id = "RUSTSEC-2023-0071", reason = "only public-key RSA operations server-side" },
    # Unmaintained (no known vulnerability), pulled in by rhai; revisit when rhai replaces it.
    { id = "RUSTSEC-2026-0249", reason = "transitive via rhai, no vulnerability" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
