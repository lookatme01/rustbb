# Example reverse proxy for one or more rbb web nodes.
#
# rbb believes X-Forwarded-For only from addresses in RBB_TRUSTED_PROXIES (set it to this
# proxy's address or network, together with RBB_TRUST_PROXY=true). This proxy *replaces* the
# client-supplied chain with the address it saw, so nothing a client sends survives; if another
# proxy or CDN sits in front, use $proxy_add_x_forwarded_for instead and add that hop's
# addresses to RBB_TRUSTED_PROXIES too.
upstream rbb {
    server web:8080;
    # server 10.0.0.12:8080;   # more nodes for horizontal scaling
    keepalive 64;
}

# Connection caps at the edge (rbb enforces its own SSE limits too).
limit_conn_zone $binary_remote_addr zone=perip:10m;
# Coarse request rate limit for credential and abuse-prone endpoints; rbb keeps its own
# shared-store limits per account and address.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    # listen 443 ssl http2;
    server_name forum.example.com;
    # ssl_certificate / ssl_certificate_key ...

    # Most requests are small forms. Larger bodies only where rbb accepts them (its own limits
    # are enforced as the body streams in, so these are a first line, not the only one).
    client_max_body_size 1m;
    limit_conn perip 64;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /static/ {
        proxy_pass http://rbb;
        expires 7d;
    }

    # Server-Sent Events: no buffering, long reads.
    location = /live {
        proxy_pass http://rbb;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /attachment/upload {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_pass http://rbb;
    }
    location ~ ^/(usercp/avatar|admin/) {
        client_max_body_size 26m;
        proxy_pass http://rbb;
    }

    location ~ ^/(member/login|member/register|member/lostpw|member/resetpw|api/v1/auth/token) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://rbb;
    }

    # Health and metrics are internal (admin listener on :9090); don't expose them.
    location ~ ^/(livez|readyz|healthz|metrics)$ {
        return 404;
    }

    location / {
        proxy_pass http://rbb;
    }
}
