# Example nginx reverse proxy for one or more rbb nodes.
upstream rbb {
    server 127.0.0.1:8080;
    # server 10.0.0.12:8080;   # add more nodes for horizontal scaling
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name forum.example.com;
    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 64m;

    # Static files are embedded in the binary and cached for a week; let nginx cache them too.
    location /static/ {
        proxy_pass http://rbb;
        proxy_cache_valid 200 7d;
        expires 7d;
    }

    # Server-Sent Events: disable buffering.
    location = /live {
        proxy_pass http://rbb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://rbb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
